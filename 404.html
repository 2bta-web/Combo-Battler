<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - コンボローグストライク</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            background: #1a1a2e;
            color: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .fof-title {
            font-size: 72px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 16px;
        }
        .fof-desc {
            font-size: 22px;
            color: #888;
            margin-bottom: 30px;
        }
        .fof-link {
            display: inline-block;
            padding: 12px 32px;
            font-size: 18px;
            color: #88aaff;
            border: 2px solid #88aaff;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .fof-link:hover {
            color: #fff;
            background: rgba(136, 170, 255, 0.2);
        }
    </style>
</head>
<body>
    <div>
        <div class="fof-title">404</div>
        <div class="fof-desc">お探しのページは見つかりませんでした</div>
        <a class="fof-link" href="index.html">ゲームに戻る</a>
    </div>
</body>
</html>
